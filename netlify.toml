[build]
command = "npm run build"
publish = "dist"

[[headers]]
for = "/data/*"
[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/*.gz"
[headers.values]
Content-Type = "application/gzip"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/catalog/*"
[headers.values]
Cache-Control = "no-cache"

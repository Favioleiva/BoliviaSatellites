[build]
command = "python3 scripts/build_netlify.py"
publish = "dist"

# Set BOLIVIA_DATA_RELEASE_TAG in Netlify after uploading the matching Release assets.
# Missing data and the human-authorized 300 MiB budget remain build failures.

[[headers]]
for = "/data/*"
[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/*.gz"
[headers.values]
Content-Type = "application/gzip"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/catalog/*"
[headers.values]
Cache-Control = "no-cache"

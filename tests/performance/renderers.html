<!doctype html><meta charset="utf-8"><title>Local renderer benchmark</title>
<canvas id="canvas" width="1000" height="500"></canvas><canvas id="gpu" width="1000" height="500"></canvas>
<script>
// Isolated drawing comparison, not a substitute for complete application/network trials.
const seed=42;const raw=(id,t)=>id%11===0?NaN:id%11===1?.25:id%11===2?0:id%11===4&&t>=500&&t<=1500?NaN:t%997<2?NaN:id%11===3&&t===3141?.95:Math.sin(t*.013+id*.1+seed)*.3+Math.cos(t*.003)*.2;
function fixture(){let lines=[],peak=0;for(let id=0;id<60;id++){let exact=Float64Array.from({length:10000},(_,t)=>raw(id,t)),v=[];peak=Math.max(peak,exact.byteLength);for(let t=0;t<10000;t+=20){let lo=t,hi=t;for(let j=t;j<Math.min(t+20,10000);j++){if(exact[j]<exact[lo]||!Number.isFinite(exact[lo]))lo=j;if(exact[j]>exact[hi]||!Number.isFinite(exact[hi]))hi=j}for(let j of [...new Set([t,lo,hi,Math.min(t+19,9999)])].sort((a,b)=>a-b))v.push(j/9999*2-1,exact[j])}lines.push(new Float32Array(v))}return {lines,peak,selected:Float64Array.from({length:10000},(_,t)=>raw(2999,t))}}
function canvasSetup(lines){let c=document.getElementById('canvas'),ctx=c.getContext('2d');return()=>{ctx.clearRect(0,0,1000,500);ctx.strokeStyle='#5ad6c6';for(let a of lines){ctx.beginPath();let on=false;for(let j=0;j<a.length;j+=2){if(!Number.isFinite(a[j+1])){on=false;continue}let x=(a[j]+1)*500,y=(1-a[j+1])*250;on?ctx.lineTo(x,y):ctx.moveTo(x,y);on=true}ctx.stroke()}}}
function glSetup(lines){let gl=document.getElementById('gpu').getContext('webgl');if(!gl)return null;let compile=(type,s)=>{let x=gl.createShader(type);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x};let p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,'attribute vec2 pos;void main(){gl_Position=vec4(pos,0.,1.);}'));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,'precision mediump float;void main(){gl_FragColor=vec4(.35,.84,.78,1.);}'));gl.linkProgram(p);gl.useProgram(p);let pos=gl.getAttribLocation(p,'pos');gl.enableVertexAttribArray(pos);let batches=[];for(let a of lines){let start=0;for(let j=0;j<=a.length;j+=2){if(j===a.length||!Number.isFinite(a[j+1])){if(j-start>=4){let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,a.slice(start,j),gl.STATIC_DRAW);batches.push([b,(j-start)/2])}start=j+2}}}return()=>{gl.clear(gl.COLOR_BUFFER_BIT);for(let [b,n] of batches){gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.LINE_STRIP,0,n)}gl.finish()}}
window.runFixture=async()=>{let start=performance.now(),f=fixture(),buildMs=performance.now()-start,results=[];for(let [name,setup] of [['Canvas',canvasSetup],['WebGL',glSetup]]){let draw=setup(f.lines);if(!draw){results.push({name,status:'BLOCKED',reason:'WebGL unavailable'});continue}draw();for(let mode of ['cold-context','warm'])for(let i=0;i<20;i++){if(mode==='cold-context')draw=setup(f.lines);let t=performance.now();draw();results.push({name,mode,run:i,draw_ms:performance.now()-t});await new Promise(requestAnimationFrame)}}return {seed,fixture_cases:['empty','constant','zero','spike','long gap','short gap'],logical_series:3000,periods:10000,loaded_context_series:60,selected_id:2999,selected_length:f.selected.length,selected_exact:f.selected.every((v,t)=>Object.is(v,raw(2999,t))),buildMs,retained_array_bytes:f.lines.reduce((s,a)=>s+a.byteLength,0)+f.selected.byteLength,peak_temporary_bytes:f.peak,results,limitations:['Synthetic renderer microbenchmark only; not full application equivalence.','Drawing Float32 coordinates does not change Float64 exact series.','No 30-million-row browser allocation or download.','WebGL rasterisation completion enforced with finish; Canvas timing measures API submission.']}}
</script>
